<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Project Sage" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap"
      rel="stylesheet"
    />
    <title>Project Sage</title>
    <style>
      :root {
        /* Project Sage Brand Palette */
        --color-bg: #F3F3ED; /* Warm Ivory */
        --color-card-bg: #F8F8F4;
        --color-text: #000000; /* Black */
        --color-dark: #151A19; /* Soft Black */
        --color-deep-forest: #182D2C;
        --color-sage-green: #42645B;
        --color-sage-mist: #8FA9A0;
        --color-text-muted: #676B64;
        --color-text-faint: #89918E; /* Cool Gray */
        --color-muted-gold: #C7B68A;
        --color-border-light: rgba(21, 26, 25, 0.12);

        /* Editorial Typography (matching earthalignment.ai) */
        --font-serif: "Newsreader", "Times New Roman", Georgia, serif;
        --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        background-color: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-sans);
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow-x: hidden;
        position: relative;
      }

      ::selection {
        background-color: var(--color-dark);
        color: var(--color-bg);
      }

      @keyframes fadeInUp {
        0% {
          opacity: 0;
          transform: translateY(16px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-fade-in {
        animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Centered Hero Title */
      .hero-center {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6rem 2rem 3rem;
        width: 100%;
      }

      .title {
        font-family: var(--font-serif);
        font-size: clamp(2.5rem, 5.5vw, 5.2rem);
        font-weight: 400;
        line-height: 1.05;
        letter-spacing: -0.025em;
        color: var(--color-text);
        text-align: center;
      }

      /* Smaller Bottom Forms Section (Follow along & Get in touch) */
      .bottom-section {
        width: 100%;
        max-width: 1080px;
        margin: 0 auto;
        padding: 0 1.5rem 2.25rem;
      }

      .get-involved-section {
        display: flex;
        justify-content: center;
        width: 100%;
      }

      .forms-two-col-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        width: 100%;
        max-width: 540px;
        margin: 0 auto;
        align-items: stretch;
      }

      .form-column {
        width: 100%;
        display: flex;
      }

      .form-card {
        background: var(--color-card-bg);
        border: 1px solid var(--color-border-light);
        border-radius: 4px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
        width: 100%;
        padding: 1.15rem 1.1rem;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .row-form,
      .row-contact-form {
        padding: 0;
        margin: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        height: 100%;
        justify-content: space-between;
      }

      .form-header {
        margin-bottom: 0.75rem;
        text-align: center;
      }

      .form-title {
        font-family: var(--font-serif);
        font-size: 1.02rem;
        font-weight: 500;
        letter-spacing: -0.01em;
        color: var(--color-text);
        margin: 0;
        text-align: center;
        line-height: 1.25;
      }

      .site-form {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin: 0;
        width: 100%;
      }

      .form-field-group,
      .form-submit-wrapper {
        width: 100%;
        margin: 0;
        position: relative;
      }

      .form-control {
        width: 100%;
        padding: 0.48rem 0.68rem;
        font-family: var(--font-sans);
        font-size: 0.78rem;
        color: var(--color-text);
        background: #ffffff;
        border: 1px solid var(--color-border-light);
        border-radius: 4px;
        outline: none;
        transition: border-color 0.25s ease, box-shadow 0.25s ease;
        line-height: 1.35;
      }

      .form-control:focus {
        border-color: var(--color-dark);
        box-shadow: 0 0 0 2px rgba(21, 26, 25, 0.08);
      }

      .form-control::placeholder {
        color: var(--color-text-faint);
        font-family: var(--font-sans);
      }

      .form-textarea {
        resize: vertical;
        min-height: 44px;
      }

      .submit-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        width: 100%;
        padding: 0.54rem 0.75rem;
        background: var(--color-dark);
        color: var(--color-bg);
        border: 1px solid var(--color-dark);
        border-radius: 4px;
        font-family: var(--font-mono);
        font-size: 0.7rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        line-height: 1;
      }

      .submit-btn:hover {
        background: #25282a;
        border-color: #25282a;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(17, 18, 19, 0.12);
      }

      .submit-btn:active {
        transform: translateY(0);
      }

      .btn-arrow {
        display: inline-block;
        transition: transform 0.25s ease;
      }

      .submit-btn:hover .btn-arrow {
        transform: translateX(3px);
      }

      .success-body {
        padding: 1.25rem 0.5rem;
        text-align: center;
        margin: auto 0;
      }

      .success-title {
        font-family: var(--font-serif);
        font-size: 1.1rem;
        font-weight: 400;
        letter-spacing: -0.01em;
        color: var(--color-text);
        margin-bottom: 0.3rem;
        line-height: 1.25;
      }

      .success-desc {
        font-family: var(--font-sans);
        font-size: 0.75rem;
        color: var(--color-text-muted);
        line-height: 1.45;
        margin: 0;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* Footer (matching earthalignment.ai) */
      .site-footer {
        text-align: center;
        padding: 2.25rem 2rem;
        border-top: 1px solid var(--color-border-light);
        width: 100%;
      }

      .site-footer p {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        color: var(--color-text-muted);
      }

      @media (max-width: 640px) {
        .forms-two-col-grid {
          grid-template-columns: 1fr;
          max-width: 340px;
        }
      }
    </style>
  </head>
  <body>
    <main class="hero-center animate-fade-in">
      <h1 class="title">Project Sage</h1>
    </main>

    <div class="bottom-section animate-fade-in">
      <section class="get-involved-section">
        <div class="forms-two-col-grid">
          <!-- Column 1: Follow along for updates -->
          <div class="form-column">
            <div class="form-card">
              <div id="subscribe-body" class="row-form">
                <div class="form-header">
                  <h3 class="form-title">Follow along for updates.</h3>
                </div>
                <form
                  id="subscribe-form"
                  class="site-form"
                  action="https://assets.mailerlite.com/jsonp/2715902/forms/201418196218021362/subscribe"
                  method="post"
                  target="_blank"
                >
                  <div class="form-field-group">
                    <label for="subscribe-email" class="sr-only">Email address</label>
                    <input
                      id="subscribe-email"
                      aria-label="email"
                      aria-required="true"
                      type="email"
                      class="form-control"
                      name="fields[email]"
                      placeholder="Email address"
                      autocomplete="email"
                      required
                    />
                  </div>
                  <input type="hidden" name="ml-submit" value="1" />
                  <input type="hidden" name="anticsrf" value="true" />
                  <div class="form-submit-wrapper">
                    <button type="submit" class="submit-btn">
                      <span class="btn-text">Subscribe</span>
                      <span class="btn-arrow">&rarr;</span>
                    </button>
                  </div>
                </form>
              </div>
              <div id="subscribe-success" class="success-body" style="display: none;">
                <h3 class="success-title">Thank you!</h3>
                <p class="success-desc">You have successfully joined our subscriber list.</p>
              </div>
            </div>
          </div>

          <!-- Column 2: Get in touch -->
          <div class="form-column">
            <div class="form-card">
              <div id="contact-body" class="row-contact-form">
                <div class="form-header">
                  <h3 class="form-title">Get in touch</h3>
                </div>
                <form
                  id="contact-form"
                  class="site-form"
                  action="https://formsubmit.co/nataliakvasquez@gmail.com"
                  method="POST"
                >
                  <input type="hidden" name="_subject" value="New message from Project Sage" />
                  <input type="hidden" name="_captcha" value="false" />
                  <input type="text" name="_honey" style="display: none" />
                  <div class="form-field-group">
                    <label for="contact-email" class="sr-only">Email address</label>
                    <input
                      type="email"
                      id="contact-email"
                      name="email"
                      class="form-control"
                      placeholder="Email address"
                      required
                      autocomplete="email"
                    />
                  </div>
                  <div class="form-field-group">
                    <label for="contact-message" class="sr-only">Your message</label>
                    <textarea
                      id="contact-message"
                      name="message"
                      class="form-control form-textarea"
                      placeholder="Your message"
                      rows="2"
                      required
                    ></textarea>
                  </div>
                  <div class="form-submit-wrapper">
                    <button type="submit" id="contact-submit-btn" class="submit-btn">
                      <span class="btn-text">Send message</span>
                      <span class="btn-arrow">&rarr;</span>
                    </button>
                  </div>
                </form>
              </div>
              <div id="contact-success" class="success-body" style="display: none;">
                <h3 class="success-title">Thank you!</h3>
                <p class="success-desc">Your message has been sent. We’ll be in touch soon.</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <footer class="site-footer">
      <p>&copy; 2026 Project Sage. All rights reserved.</p>
    </footer>

    <script>
      const subscribeForm = document.getElementById("subscribe-form");
      const subscribeBody = document.getElementById("subscribe-body");
      const subscribeSuccess = document.getElementById("subscribe-success");

      if (subscribeForm && subscribeBody && subscribeSuccess) {
        subscribeForm.addEventListener("submit", async function (e) {
          e.preventDefault();
          const formData = new FormData(subscribeForm);
          try {
            await fetch(subscribeForm.action, {
              method: "POST",
              body: formData,
              mode: "no-cors",
            });
            subscribeBody.style.display = "none";
            subscribeSuccess.style.display = "block";
            subscribeForm.reset();
          } catch (err) {
            subscribeForm.submit();
          }
        });
      }

      const contactForm = document.getElementById("contact-form");
      const contactSubmitBtn = document.getElementById("contact-submit-btn");
      const contactSuccess = document.getElementById("contact-success");
      const contactBody = document.getElementById("contact-body");

      if (contactForm && contactSubmitBtn && contactSuccess && contactBody) {
        contactForm.addEventListener("submit", async function (e) {
          e.preventDefault();

          const emailInput = document.getElementById("contact-email");
          const messageInput = document.getElementById("contact-message");
          if (!emailInput || !messageInput) return;

          const email = emailInput.value.trim();
          const message = messageInput.value.trim();
          if (!email || !message) return;

          const origBtnHtml = contactSubmitBtn.innerHTML;
          contactSubmitBtn.disabled = true;
          contactSubmitBtn.innerHTML = '<span class="btn-text">Sending...</span>';

          try {
            const response = await fetch("https://formsubmit.co/ajax/nataliakvasquez@gmail.com", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Accept: "application/json",
              },
              body: JSON.stringify({
                email: email,
                message: message,
                _subject: "New message from Project Sage",
              }),
            });

            if (response.ok) {
              contactBody.style.display = "none";
              contactSuccess.style.display = "block";
              contactForm.reset();
            } else {
              contactForm.submit();
            }
          } catch (err) {
            contactForm.submit();
          } finally {
            contactSubmitBtn.disabled = false;
            contactSubmitBtn.innerHTML = origBtnHtml;
          }
        });
      }
    </script>
  </body>
</html>
